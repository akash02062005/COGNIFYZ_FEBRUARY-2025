<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Webpage</title>
    <link rel="stylesheet" href="./cog task 2.css">
    <script src="./cog task 2.js"></script>
</head>
<body>
    <div class="one">
        <div class="two">
            <div class="three">
                <h2>Color Changing Button</h2>
                <button id="colorButton" onclick="changeColor()">Click Me!</button>
            </div>
            <div class="section">
                <h2>Greeting Message</h2>
                <button onclick="showGreeting()">Click for Greeting</button>
            </div>
        </div>
        <div class="child-container child-2">
            <div class="section">
                <h2>Basic Calculator</h2>
                <input type="number" id="num1" placeholder="Enter first number">
                <input type="number" id="num2" placeholder="Enter second number">
                <button onclick="addNumbers()">Add</button>
                <p id="result"></p>
            </div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
